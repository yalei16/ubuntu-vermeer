name: _Build Device Packages (Ubuntu / vermeer)

# 可复用工作流：构建 Ubuntu 侧的全部设备功能包（.deb）
# 由 rootfs.yml 通过 workflow_call 调用。
#
# 相对 sheng 版本删掉的作业（这些包是 sheng 专有的，K70 上没有对应物）：
#   build-sheng-sensors（SSC 传感器注册表：K70 的 registry 还没人提取）
#   build-sheng-devauth（sheng 的 qtee/设备认证服务）
#   package-alsa       （sheng 的 WCD938X UCM2：K70 音频链路不同，且主线尚未打通）
#   fetch-xiaomi-debs  （ianchb 的 xiaomi-* 快充/触控/笔/指纹包，按 sheng 的硬件写死）
on:
  # 由 rootfs.yml 调用
  workflow_call:
    inputs:
      kernel_source:
        description: 'custom_build 或 prebuilt'
        required: false
        type: string
        default: 'custom_build'
      kernel_repo:
        description: '内核仓库 URL（custom_build 时使用）'
        required: false
        type: string
        default: 'https://github.com/Xlie-Electronic-Customs/linux'
      kernel_branch:
        description: '内核仓库分支'
        required: false
        type: string
        default: 'master'
      kernel_config_fragments:
        description: '树内配置片段（空格分隔，按顺序叠加在 defconfig 上）'
        required: false
        type: string
        default: 'sm8550.config hardening.config'
      firmware_repo:
        description: '设备固件仓库 URL'
        required: false
        type: string
        default: 'https://github.com/Xlie-Electronic-Customs/linux-firmware-xiaomi-vermeer'
      firmware_branch:
        description: '固件仓库分支'
        required: false
        type: string
        default: 'main'
      append_dtb:
        description: '把 DTB 拼到内核尾部（pmOS 的 append_dtb 做法；原厂 boot.img 里没有 DTB，若 ABL 从 vendor_boot 取 DT 则设为 false）'
        required: false
        type: boolean
        default: true
    outputs:
      kernel_version:
        description: 'custom_build 时的内核版本'
        value: ${{ jobs.build-kernel.outputs.kernel_version }}

  # 也可以单独手动跑，只产出设备包（不组装 rootfs）——调固件/内核时省时间
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'custom_build（编内核，约 40–60 分钟）或 skip（只打包固件/fastrpc 等）'
        required: true
        type: choice
        default: 'skip'
        options:
          - 'skip'
          - 'custom_build'
      kernel_repo:
        description: '内核仓库 URL'
        required: false
        type: string
        default: 'https://github.com/Xlie-Electronic-Customs/linux'
      kernel_branch:
        description: '内核仓库分支'
        required: false
        type: string
        default: 'master'
      kernel_config_fragments:
        description: '树内配置片段（空格分隔）'
        required: false
        type: string
        default: 'sm8550.config hardening.config'
      firmware_repo:
        description: '设备固件仓库 URL'
        required: false
        type: string
        default: 'https://github.com/Xlie-Electronic-Customs/linux-firmware-xiaomi-vermeer'
      firmware_branch:
        description: '固件仓库分支'
        required: false
        type: string
        default: 'main'
      append_dtb:
        description: 'DTB 拼到内核尾部（默认 true）'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  build-kernel:
    name: Build Kernel (custom_build)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      kernel_version: ${{ steps.build.outputs.kernel_version }}
    steps:
      - name: Skip (Prebuilt Kernel)
        if: inputs.kernel_source != 'custom_build'
        run: echo "✓ kernel_source=prebuilt，跳过内核编译"

      - uses: actions/checkout@v7
        if: inputs.kernel_source == 'custom_build'

      - name: Install Build Tools
        if: inputs.kernel_source == 'custom_build'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev \
            bc ccache clang llvm lld kmod
          ccache --set-config=max_size=10G || true

      - name: Restore ccache
        if: inputs.kernel_source == 'custom_build'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-kernel-vermeer-${{ inputs.kernel_branch }}-${{ hashFiles('vermeer-extra.config') }}
          restore-keys: |
            ccache-kernel-vermeer-${{ inputs.kernel_branch }}-
            ccache-kernel-vermeer-

      - name: Build Kernel
        id: build
        if: inputs.kernel_source == 'custom_build'
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_CONFIG_FRAGMENTS: ${{ inputs.kernel_config_fragments }}
          APPEND_DTB: ${{ inputs.append_dtb }}
        run: |
          chmod +x scripts/packages/build-kernel.sh
          ./scripts/packages/build-kernel.sh

      - name: Upload Kernel Package
        if: inputs.kernel_source == 'custom_build'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-custom-deb
          path: linux-xiaomi-vermeer.deb
          retention-days: 3
          if-no-files-found: error

      - name: Upload Kernel Image
        if: inputs.kernel_source == 'custom_build'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-custom-image
          path: kernel-dtb_vermeer
          retention-days: 3
          if-no-files-found: error

  build-fastrpc:
    name: Build fastrpc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool pkg-config \
            git wget unzip dpkg-dev libyaml-dev linux-libc-dev
      - name: Build
        run: |
          chmod +x scripts/packages/build-fastrpc.sh
          ./scripts/packages/build-fastrpc.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fastrpc-deb
          path: fastrpc_*.deb
          retention-days: 3
          if-no-files-found: error

  build-libssc:
    name: Build libssc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build git pkg-config python3-pip \
            libglib2.0-dev libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev \
            linux-libc-dev protobuf-compiler protobuf-c-compiler patch
      - name: Build
        run: |
          chmod +x scripts/packages/build-libssc.sh
          ./scripts/packages/build-libssc.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libssc-deb
          path: libssc_*.deb
          retention-days: 3
          if-no-files-found: error

  build-iio-sensor-proxy:
    name: Build iio-sensor-proxy (SSC)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [build-libssc]
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ninja-build git pkg-config python3-pip wget \
            libglib2.0-dev libgudev-1.0-dev libpolkit-gobject-1-dev libsystemd-dev libdbus-1-dev \
            systemd libqmi-glib-dev libmbim-glib-dev linux-libc-dev \
            protobuf-compiler protobuf-c-compiler
      - uses: actions/download-artifact@v8
        with:
          name: libssc-deb
      - name: Build
        run: |
          chmod +x scripts/packages/build-iio-sensor-proxy.sh
          ./scripts/packages/build-iio-sensor-proxy.sh
      - uses: actions/upload-artifact@v7
        with:
          name: iio-sensor-proxy-deb
          path: iio-sensor-proxy_*.deb
          retention-days: 3
          if-no-files-found: error

  package-firmware:
    name: Package firmware-xiaomi-vermeer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev git
      - name: Package
        env:
          FIRMWARE_REPO: ${{ inputs.firmware_repo }}
          FIRMWARE_BRANCH: ${{ inputs.firmware_branch }}
        run: |
          chmod +x scripts/packages/build-firmware.sh
          ./scripts/packages/build-firmware.sh
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-xiaomi-vermeer-deb
          path: firmware-xiaomi-vermeer.deb
          retention-days: 3
          if-no-files-found: error

name: Build RootFS (Ubuntu / vermeer)

# 为 红米 K70 / POCO F6 Pro（vermeer, SM8550）构建 Ubuntu arm64 rootfs.img + boot.img
#
# 从 code002-2/ubuntu-sheng（小米平板 6S Pro）移植而来。结构保持不变：
#   * 设备功能包的构建抽到可复用工作流 .github/workflows/_packages.yml
#   * 具体构建步骤放在 scripts/ 下（宿主 scripts/host、镜像内 scripts/in-chroot），
#     YAML 仅做编排与参数传递
#   * 设备名/上游地址集中在 scripts/common/device-env.sh
#
# 与 sheng 版的关键差异（详见 docs/移植对照.md）：
#   * 内核默认 custom_build：vermeer 没有现成的 boot.img release
#   * boot.img 用 header_version 4（GKI）而不是 sheng 的 0
#   * 设备包换成 firmware/内核的 vermeer 版本，删掉 sheng 专有的传感器/alsa/xiaomi-* 包
on:
  workflow_dispatch:
    inputs:
      ubuntu_series:
        description: 'Ubuntu 版本'
        required: true
        type: choice
        default: '26.04 (resolute)'
        options:
          - '26.04 (resolute)'
          - '26.10 (stonking)'
          - '25.10 (questing)'
      desktop:
        description: '桌面环境（server 为无图形界面；Lomiri = 原 Ubuntu Touch 的 Unity8，触屏机型更合适）'
        required: true
        type: choice
        default: 'KDE Plasma'
        options:
          - 'KDE Plasma'
          - 'GNOME'
          - 'Lomiri'
          - 'server'
      plasma_mobile:
        description: '使用 plasma-mobile 替代 plasma-desktop（仅 KDE Plasma 生效）'
        required: false
        type: boolean
        default: false
      browser:
        description: '浏览器（Ubuntu 主归档的 firefox 是 snap 过渡包，选择 firefox 将从 Mozilla 官方 apt 源安装 deb 版）'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'firefox'
      autologin:
        description: '自动登录（Lomiri 经 greetd 恒为自动登录，本项对它无效）'
        required: false
        type: boolean
        default: true
      username:
        description: '普通用户名'
        required: false
        type: string
        default: 'username'
      hostname:
        description: '主机名'
        required: false
        type: string
        default: 'xiaomi-vermeer'
      password:
        description: '镜像密码（留空则用 ROOTFS_PASSWORD secret，都为空则为默认 password）；注意输入值会明文显示在运行页面'
        required: false
        type: string
        default: ''
      language:
        description: '系统语言（locale）'
        required: false
        type: choice
        default: 'zh_CN.UTF-8'
        options:
          - 'None (C.UTF-8)'
          - 'zh_CN.UTF-8'
          - 'en_US.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
      boot_mode:
        description: '启动分区模式'
        required: true
        type: choice
        default: 'dual (linux)'
        options:
          - 'dual (linux)'
          - 'single (userdata)'
          - 'custom'
      custom_partition:
        description: '自定义分区名（仅 boot_mode=custom 时需要）'
        required: false
        type: string
        default: ''
      quiet_boot:
        description: '安静启动（Plymouth，server 模式忽略）'
        required: false
        type: boolean
        default: true
      kernel_source:
        description: '内核来源：custom_build = 用 XEC/linux 自己编（推荐）；prebuilt = 从某个 release 取现成 boot.img'
        required: true
        type: choice
        default: 'custom_build'
        options:
          - 'custom_build'
          - 'prebuilt'
      kernel_repo:
        description: '内核仓库（custom_build 时使用）'
        required: false
        type: string
        default: 'https://github.com/Xlie-Electronic-Customs/linux'
      kernel_branch:
        description: '内核分支（vermeer DTS/面板驱动在这个树里）'
        required: false
        type: string
        default: 'master'
      kernel_config_fragments:
        description: '树内配置片段（空格分隔，叠加在 defconfig 上）'
        required: false
        type: string
        default: 'sm8550.config hardening.config'
      kernel_releases_repo:
        description: 'prebuilt 时的 release 仓库（owner/repo）'
        required: false
        type: string
        default: ''
      kernel_boot_pattern:
        description: 'prebuilt 时的 boot.img 文件名'
        required: false
        type: string
        default: ''
      kernel_release:
        description: 'prebuilt 取哪个 release（留空取最新）'
        required: false
        type: string
        default: ''
      firmware_repo:
        description: '设备固件仓库（固件在仓库的 xiaomi-vermeer/ 子目录下）'
        required: false
        type: string
        default: 'https://github.com/Xlie-Electronic-Customs/linux-firmware-xiaomi-vermeer'
      firmware_branch:
        description: '固件仓库分支'
        required: false
        type: string
        default: 'main'
      boot_header_version:
        description: 'boot.img 头版本（K70 原厂是 4；务必用 scripts/host/12-analyze-bootimg.py 核对原厂 boot.img）'
        required: false
        type: string
        default: '4'
      boot_pagesize:
        description: 'boot.img 页大小（K70 原厂 4096）'
        required: false
        type: string
        default: '4096'
      extra_cmdline:
        description: '追加内核 cmdline（调试用，例如 "earlycon console=ttyMSM0,115200"）'
        required: false
        type: string
        default: ''
      install_modem_stack:
        description: '安装 modem 用户态（rmtfs/tqftpserv/qrtr-tools，缺失时跳过）：4G 的前置，但现在还不会自动拨号'
        required: false
        type: boolean
        default: true
      rootfs_size:
        description: 'rootfs.img 初始大小（构建后会收缩，首启自动扩容）'
        required: false
        type: string
        default: '10G'
      shrink_image:
        description: '构建后收缩镜像（e2fsck + resize2fs -M）'
        required: false
        type: boolean
        default: true
      upload_artifacts:
        description: '上传 rootfs.img / boot.img（测试时可关闭）'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  packages:
    name: Build Device Packages
    uses: ./.github/workflows/_packages.yml
    with:
      kernel_source: ${{ inputs.kernel_source }}
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_branch: ${{ inputs.kernel_branch }}
      kernel_config_fragments: ${{ inputs.kernel_config_fragments }}
      firmware_repo: ${{ inputs.firmware_repo }}
      firmware_branch: ${{ inputs.firmware_branch }}

  build-rootfs:
    name: Assemble Ubuntu RootFS
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    needs: [packages]
    env:
      ROOTFS_MOUNT: /mnt/rootfs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Arguments
        env:
          IN_PASSWORD: ${{ inputs.password }}
          SECRET_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          # 密码优先级：password 输入项 > ROOTFS_PASSWORD secret > 默认 password。
          if [ -n "$IN_PASSWORD" ]; then
            echo "::add-mask::$IN_PASSWORD"
            PASSWORD="$IN_PASSWORD"
            echo "镜像密码取自 password 输入项（该值会显示在本页面的输入摘要中，介意请改用 ROOTFS_PASSWORD secret）"
          elif [ -n "$SECRET_PASSWORD" ]; then
            echo "镜像密码取自 ROOTFS_PASSWORD secret"
            PASSWORD="$SECRET_PASSWORD"
          else
            echo "::warning::未设置密码（password 输入与 ROOTFS_PASSWORD secret 均为空），镜像将使用不安全的默认密码 password"
            PASSWORD=""
          fi
          case "$PASSWORD" in
            *$'\n'*) echo "::error::密码不能包含换行"; exit 1 ;;
          esac
          echo "ROOTFS_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          if [ "${{ inputs.boot_mode }}" = "custom" ]; then
            if [ -z "${{ inputs.custom_partition }}" ]; then
              echo "::error::boot_mode=custom 时必须填写 custom_partition"
              exit 1
            fi
          fi
          if [ "${{ inputs.kernel_source }}" = "prebuilt" ]; then
            if [ -z "${{ inputs.kernel_releases_repo }}" ] || [ -z "${{ inputs.kernel_boot_pattern }}" ]; then
              echo "::error::kernel_source=prebuilt 时必须给出 kernel_releases_repo 与 kernel_boot_pattern（vermeer 上游没有现成 boot.img）"
              exit 1
            fi
          fi
          for v in "${{ inputs.boot_header_version }}" "${{ inputs.boot_pagesize }}"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::boot_header_version / boot_pagesize 必须是十进制数字"; exit 1 ;;
            esac
          done

          # 自由文本输入会被写进镜像内的 /root/build.env 并参与 shell 片段拼接，
          # 这里做白名单校验
          case "${{ inputs.custom_partition }}" in
            "") : ;;
            *[!a-zA-Z0-9_-]*) echo "::error::custom_partition 只允许字母数字与 _ -（PARTLABEL 名）"; exit 1 ;;
          esac
          case "${{ inputs.username }}" in
            ""|*[!a-zA-Z0-9_.-]*) echo "::error::username 只允许字母数字与 _ . -"; exit 1 ;;
          esac
          case "${{ inputs.hostname }}" in
            ""|*[!a-zA-Z0-9.-]*) echo "::error::hostname 只允许字母数字与 . -"; exit 1 ;;
          esac
          case "${{ inputs.rootfs_size }}" in
            ""|*[!0-9GgMmKk]*) echo "::error::rootfs_size 只允许形如 10G / 8192M 的取值"; exit 1 ;;
          esac
          case "${{ inputs.extra_cmdline }}" in
            ""|*[\;\|\&\$\`\(\)]*|\<*|\>*) echo "::error::extra_cmdline 不允许 shell 元字符"; exit 1 ;;
          esac

      - name: Parse Arguments
        id: parse
        run: |
          SERIES="${{ inputs.ubuntu_series }}"
          SERIES="${SERIES%% *}"

          QUIET="false"
          if [ "${{ inputs.quiet_boot }}" = "true" ] && [ "${{ inputs.desktop }}" != "server" ]; then
            QUIET="true"
          fi

          case "${{ inputs.boot_mode }}" in
            "single (userdata)") LABEL="userdata" ;;
            "dual (linux)")      LABEL="linux" ;;
            "custom")            LABEL="${{ inputs.custom_partition }}" ;;
            *) echo "::error::未知的 boot_mode: ${{ inputs.boot_mode }}"; exit 1 ;;
          esac

          SLUG="$(printf '%s' "${{ inputs.desktop }}" | tr ' ' '-')"

          {
            echo "series=${SERIES}"
            echo "label=${LABEL}"
            echo "quiet_boot_enabled=${QUIET}"
            echo "desktop_slug=${SLUG}"
          } >> "$GITHUB_OUTPUT"

          echo "Ubuntu $SERIES / ${{ inputs.desktop }} / 分区 $LABEL / quiet=$QUIET"

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap curl git e2fsprogs file gzip

      - name: "[Prebuilt] Download Kernel & boot.img"
        if: inputs.kernel_source == 'prebuilt'
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_IMG_PATTERN: ${{ inputs.kernel_boot_pattern }}
          KERNEL_RELEASES_REPO: ${{ inputs.kernel_releases_repo }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          chmod +x scripts/host/10-fetch-kernel.sh
          ./scripts/host/10-fetch-kernel.sh

      - name: "[Custom] Download Kernel Package"
        if: inputs.kernel_source == 'custom_build'
        uses: actions/download-artifact@v8
        with:
          name: kernel-custom-deb
          path: debs

      - name: "[Custom] Download Kernel Image"
        if: inputs.kernel_source == 'custom_build'
        uses: actions/download-artifact@v8
        with:
          name: kernel-custom-image

      - name: "[Custom] Generate boot.img"
        if: inputs.kernel_source == 'custom_build'
        env:
          PARTITION_LABEL: ${{ steps.parse.outputs.label }}
          QUIET_BOOT: ${{ steps.parse.outputs.quiet_boot_enabled }}
          BOOT_HEADER_VERSION: ${{ inputs.boot_header_version }}
          BOOT_PAGESIZE: ${{ inputs.boot_pagesize }}
          EXTRA_CMDLINE: ${{ inputs.extra_cmdline }}
        run: |
          chmod +x scripts/host/11-make-bootimg.sh
          ./scripts/host/11-make-bootimg.sh Image.gz-dtb_vermeer

      - name: Verify boot.img Header
        run: |
          echo "== mkbootimg 实际写出的 boot.img 头 =="
          python3 scripts/host/12-analyze-bootimg.py boot.img | sed 's/^/    /'
          test -s boot.img || { echo "::error::boot.img 为空"; exit 1; }
          test "$(head -c8 boot.img)" = "ANDROID!" || { echo "::error::boot.img 缺少 ANDROID! 魔数"; exit 1; }

      - name: Collect fastrpc
        uses: actions/download-artifact@v8
        with: { name: fastrpc-deb, path: debs }
      - name: Collect libssc
        uses: actions/download-artifact@v8
        with: { name: libssc-deb, path: debs }
      - name: Collect iio-sensor-proxy
        uses: actions/download-artifact@v8
        with: { name: iio-sensor-proxy-deb, path: debs }
      - name: Collect firmware-xiaomi-vermeer
        uses: actions/download-artifact@v8
        with: { name: firmware-xiaomi-vermeer-deb, path: debs }

      - name: Verify Collected Packages
        run: |
          count="$(find debs -maxdepth 1 -name '*.deb' | wc -l)"
          echo "共收集到 ${count} 个 deb："
          ls -lh debs/ | sed 's/^/    /'

          # 逐个断言必需包（不能用"总数 >= N"这种松阈值：丢一个 artifact 也照样通过）
          missing=0
          for p in linux-xiaomi-vermeer fastrpc libssc iio-sensor-proxy firmware-xiaomi-vermeer; do
            if ! compgen -G "debs/${p}*.deb" >/dev/null; then
              echo "::error::缺少必需的设备包: ${p}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ ! -f boot.img ]; then
            echo "::error::缺少 boot.img"
            exit 1
          fi

      - name: Create & Mount RootFS Image
        run: |
          chmod +x scripts/host/00-prepare-image.sh
          sudo bash scripts/host/00-prepare-image.sh rootfs.img "${{ inputs.rootfs_size }}" "$ROOTFS_MOUNT"

      - name: Bootstrap Ubuntu Base
        run: |
          chmod +x scripts/host/01-bootstrap.sh
          sudo env DISTRO_SERIES="${{ steps.parse.outputs.series }}" \
            bash scripts/host/01-bootstrap.sh "$ROOTFS_MOUNT"

      - name: Mount Chroot Environment
        run: |
          chmod +x scripts/host/02-mount-chroot.sh
          sudo bash scripts/host/02-mount-chroot.sh "$ROOTFS_MOUNT"

      - name: Write Build Environment
        env:
          DISTRO_SERIES: ${{ steps.parse.outputs.series }}
        run: |
          sudo tee "$ROOTFS_MOUNT/root/build.env" >/dev/null <<EOF
          DISTRO_SERIES='${DISTRO_SERIES}'
          DESKTOP='${{ inputs.desktop }}'
          PLASMA_MOBILE='${{ inputs.plasma_mobile }}'
          BROWSER='${{ inputs.browser }}'
          AUTOLOGIN='${{ inputs.autologin }}'
          USERNAME='${{ inputs.username }}'
          HOSTNAME='${{ inputs.hostname }}'
          LANGUAGE='${{ inputs.language }}'
          QUIET_BOOT='${{ steps.parse.outputs.quiet_boot_enabled }}'
          BOOT_MODE='${{ inputs.boot_mode }}'
          PARTITION_LABEL='${{ steps.parse.outputs.label }}'
          KERNEL_SOURCE='${{ inputs.kernel_source }}'
          INSTALL_MODEM_STACK='${{ inputs.install_modem_stack }}'
          EOF
          sudo chmod 600 "$ROOTFS_MOUNT/root/build.env"
          echo "build.env 内容："
          sudo cat "$ROOTFS_MOUNT/root/build.env" | sed 's/^/    /'

      - name: "[chroot] Disable snap"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/15-nosnap.sh

      - name: "[chroot] Install Base Packages"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/10-base.sh

      - name: "[chroot] Install Desktop"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/20-desktop.sh

      - name: "[chroot] Install Browser"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/25-browser.sh

      - name: "[chroot] Install Device Packages"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/30-device-packages.sh

      - name: Prepare Password File
        run: |
          if [ -n "${ROOTFS_PASSWORD:-}" ]; then
            printf '%s' "$ROOTFS_PASSWORD" | sudo tee "$ROOTFS_MOUNT/root/build.pw" >/dev/null
            sudo chmod 600 "$ROOTFS_MOUNT/root/build.pw"
          else
            echo "::warning::未设置密码，镜像密码将是 password"
          fi

      - name: "[chroot] Configure System"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/40-system-config.sh

      - name: "[chroot] Verify Image"
        run: sudo chroot "$ROOTFS_MOUNT" /root/vermeer-build/in-chroot/90-verify.sh

      - name: Cleanup Host Files
        if: always()
        run: |
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf" 2>/dev/null || true
          sudo rm -f "$ROOTFS_MOUNT/root/build.pw" 2>/dev/null || true
          sudo rm -rf "$ROOTFS_MOUNT/root/vermeer-build" 2>/dev/null || true
          sudo rm -rf "$ROOTFS_MOUNT/tmp/debs" 2>/dev/null || true

      - name: Unmount Virtual File Systems
        if: always()
        run: sudo bash scripts/host/03-umount-chroot.sh "$ROOTFS_MOUNT"

      - name: Finalize Image
        if: success()
        run: |
          chmod +x scripts/host/04-finalize-image.sh
          sudo env SHRINK_IMAGE="${{ inputs.shrink_image }}" \
            bash scripts/host/04-finalize-image.sh rootfs.img "$ROOTFS_MOUNT"

      - name: Upload RootFS Image
        if: success() && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-ubuntu-${{ steps.parse.outputs.series }}-${{ steps.parse.outputs.desktop_slug }}-${{ steps.parse.outputs.label }}
          path: rootfs.img
          retention-days: 14
          compression-level: 1
          if-no-files-found: error

      - name: Upload Boot Image
        if: success() && inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: boot-ubuntu-${{ steps.parse.outputs.series }}-${{ steps.parse.outputs.desktop_slug }}-${{ steps.parse.outputs.label }}
          path: boot.img
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Ubuntu RootFS 构建结果（vermeer）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 设备 | 红米 K70 / POCO F6 Pro (vermeer, SM8550) |"
            echo "| Ubuntu | ${{ inputs.ubuntu_series }} |"
            echo "| 桌面环境 | ${{ inputs.desktop }}${{ inputs.plasma_mobile && ' (plasma-mobile)' || '' }} |"
            echo "| 浏览器 | ${{ inputs.browser }} |"
            echo "| 分区（PARTLABEL） | ${{ steps.parse.outputs.label }} |"
            echo "| 内核来源 | ${{ inputs.kernel_source }} |"
            echo "| boot header | v${{ inputs.boot_header_version }} / pagesize ${{ inputs.boot_pagesize }} |"
            echo "| quiet boot | ${{ steps.parse.outputs.quiet_boot_enabled }} |"
            echo "| snap | 已禁用（snapd 不安装，nosnap.pref 已写入，构建末尾硬校验） |"
            echo "| rootfs.img | $(du -h rootfs.img 2>/dev/null | cut -f1 || echo 'N/A') |"
            echo "| boot.img | $(du -h boot.img 2>/dev/null | cut -f1 || echo 'N/A') |"
            echo "| 设备包数量 | $(find debs -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
